<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-database-compat.js"></script>
    <style>
        #map { 
            height: 500px; 
            margin: 10px 0; 
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        input[type="datetime-local"] {
            padding: 5px;
            margin-right: 10px;
        }
        button {
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
            color: #666;
        }
        .config-form {
            margin: 10px 0;
            padding: 10px;
            background: #eef;
            border-radius: 4px;
        }
        .config-form input {
            width: 300px;
            padding: 5px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="config-form">
        <div>
            <input type="text" id="firebaseHost" placeholder="Firebase Host (e.g., your-project.firebaseio.com)">
        </div>
        <div>
            <input type="text" id="firebaseAuth" placeholder="Firebase Auth Token">
        </div>
        <button onclick="initializeFirebase()">Connect to Firebase</button>
    </div>

    <div class="controls" style="display: none;">
        <input type="datetime-local" id="startTime">
        <input type="datetime-local" id="endTime">
        <button onclick="loadHistory()">Show History</button>
        <div id="status"></div>
    </div>
    <div id="map"></div>

    <script>
        let firebaseApp;
        let gpsRef;
        
        // Initialize map
        const map = L.map('map').setView([9.436471333, 77.567925667], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Create marker and path
        let marker = L.marker([9.436471333, 77.567925667]).addTo(map);
        let path = L.polyline([], {color: 'red', weight: 3}).addTo(map);

        function initializeFirebase() {
            const host = document.getElementById('firebaseHost').value.trim();
            const auth = document.getElementById('firebaseAuth').value.trim();

            if (!host || !auth) {
                updateStatus('Please enter both Firebase host and auth token');
                return;
            }

            // Initialize Firebase with full configuration
            const firebaseConfig = {
                databaseURL: `https://${host}`,
                authDomain: `${host}`,
            };

            try {
                // Initialize Firebase
                if (firebaseApp) {
                    firebase.app().delete();
                }
                firebaseApp = firebase.initializeApp(firebaseConfig);
                
                // Initialize database reference
                gpsRef = firebase.database().ref('GPSData');
                
                // Start real-time updates
                setupRealtimeUpdates();
                
                // Show controls
                document.querySelector('.controls').style.display = 'block';
                updateStatus('Connected to Firebase successfully');
            } catch (error) {
                console.error('Firebase initialization error:', error);
                updateStatus('Error connecting to Firebase: ' + error.message);
            }
        }

        function setupRealtimeUpdates() {
            gpsRef.limitToLast(1).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (!data.latitude || !data.longitude) return;
                
                const position = [data.latitude, data.longitude];
                marker.setLatLng(position);
                marker.bindPopup(`
                    Lat: ${data.latitude.toFixed(6)}<br>
                    Lng: ${data.longitude.toFixed(6)}<br>
                    Alt: ${data.altitude}m<br>
                    Speed: ${data.speed}km/h<br>
                    Satellites: ${data.satellites}
                `).openPopup();
                
                map.panTo(position);
            }, (error) => {
                updateStatus('Real-time update error: ' + error.message);
            });
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function loadHistory() {
            if (!gpsRef) {
                updateStatus('Please connect to Firebase first');
                return;
            }

            updateStatus('Loading historical data...');
            path.setLatLngs([]);
            
            const startTime = new Date(document.getElementById('startTime').value).getTime();
            const endTime = new Date(document.getElementById('endTime').value).getTime();

            gpsRef.orderByKey()
                .startAt(startTime.toString())
                .endAt(endTime.toString())
                .once('value')
                .then((snapshot) => {
                    const points = [];
                    let count = 0;
                    
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        if (data.latitude && data.longitude) {
                            points.push([data.latitude, data.longitude]);
                            count++;
                        }
                    });
                    
                    if (points.length > 0) {
                        path.setLatLngs(points);
                        map.fitBounds(path.getBounds());
                        updateStatus(`Loaded ${count} points from history`);
                    } else {
                        updateStatus('No data found for selected time range');
                    }
                })
                .catch((error) => {
                    console.error('Error loading historical data:', error);
                    updateStatus('Error loading historical data: ' + error.message);
                });
        }

        // Set default time range
        const now = new Date();
        const yesterday = new Date(now - 24*60*60*1000);
        document.getElementById('startTime').value = yesterday.toISOString().slice(0,16);
        document.getElementById('endTime').value = now.toISOString().slice(0,16);
    </script>
</body>
</html>
