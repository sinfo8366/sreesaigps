<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-database-compat.js"></script>
    <style>
        #map { 
            height: 500px; 
            margin: 10px 0; 
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        input[type="datetime-local"] {
            padding: 5px;
            margin-right: 10px;
        }
        button {
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="controls">
        <input type="datetime-local" id="startTime">
        <input type="datetime-local" id="endTime">
        <button onclick="loadHistory()">Show History</button>
        <div id="status"></div>
    </div>
    <div id="map"></div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            // Replace with your Firebase config
            databaseURL: "https://vehicle-tracking-7f1dd-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);

        // Initialize map
        const map = L.map('map').setView([9.436471333, 77.567925667], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Create marker and path
        let marker = L.marker([9.436471333, 77.567925667]).addTo(map);
        let path = L.polyline([], {color: 'red', weight: 3}).addTo(map);
        
        // Status display function
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // Real-time updates
        const gpsRef = firebase.database().ref('GPSData');
        gpsRef.limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const position = [data.latitude, data.longitude];
            
            marker.setLatLng(position);
            marker.bindPopup(`
                Lat: ${data.latitude.toFixed(6)}<br>
                Lng: ${data.longitude.toFixed(6)}<br>
                Alt: ${data.altitude}m<br>
                Speed: ${data.speed}km/h<br>
                Satellites: ${data.satellites}
            `).openPopup();
            
            map.panTo(position);
        });

        // Load historical data
        function loadHistory() {
            updateStatus('Loading historical data...');
            path.setLatLngs([]); // Clear existing path
            
            const startTime = new Date(document.getElementById('startTime').value).getTime();
            const endTime = new Date(document.getElementById('endTime').value).getTime();

            // Query Firebase for the specific time range
            gpsRef.orderByKey()  // Using orderByKey since your paths use timestamps as keys
                .startAt(startTime.toString())
                .endAt(endTime.toString())
                .once('value')
                .then((snapshot) => {
                    const points = [];
                    let count = 0;
                    
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        if (data.latitude && data.longitude) {
                            points.push([data.latitude, data.longitude]);
                            count++;
                        }
                    });
                    
                    if (points.length > 0) {
                        path.setLatLngs(points);
                        map.fitBounds(path.getBounds());
                        updateStatus(`Loaded ${count} points from history`);
                    } else {
                        updateStatus('No data found for selected time range');
                    }
                })
                .catch((error) => {
                    console.error('Error loading historical data:', error);
                    updateStatus('Error loading historical data');
                });
        }

        // Set default time range (last 24 hours)
        const now = new Date();
        const yesterday = new Date(now - 24*60*60*1000);
        document.getElementById('startTime').value = yesterday.toISOString().slice(0,16);
        document.getElementById('endTime').value = now.toISOString().slice(0,16);
    </script>
</body>
</html>
