<!DOCTYPE html>
<html>
<head>
    <title>Simple GPS Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }
        #map { 
            height: 100vh;
            width: 100vw;
        }
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .date-range {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="date"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .active {
            background: #2196F3;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="date-range">
            <input type="date" id="startDate">
            <span>to</span>
            <input type="date" id="endDate">
        </div>
        <div>
            <button onclick="showHistorical()" id="historicalBtn">Show Historical</button>
            <button onclick="showLive()" id="liveBtn" class="active">Live Track</button>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCQmODNdyNeNEXJXB_7u-8versZmrXYJRU",
  authDomain: "vehicle-tracking-7f1dd.firebaseapp.com",
  databaseURL: "https://vehicle-tracking-7f1dd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vehicle-tracking-7f1dd",
  storageBucket: "vehicle-tracking-7f1dd.firebasestorage.app",
  messagingSenderId: "876631887074",
  appId: "1:876631887074:web:2d9e7e1bd54f2d603b22bb",
  measurementId: "G-D6KHE5KT14"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map;
        let marker = null;
        let path = null;
        let currentListener = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 15,
                center: { lat: 0, lng: 0 },
                mapTypeId: 'roadmap'
            });
            showLive();
        }

        function showLive() {
            clearMap();
            document.getElementById('liveBtn').classList.add('active');
            document.getElementById('historicalBtn').classList.remove('active');

            if (currentListener) {
                currentListener();
            }

            const gpsRef = database.ref('GPSData');
            currentListener = gpsRef.limitToLast(1).on('child_added', (snapshot) => {
                const data = snapshot.val();
                updateMarker(data.latitude, data.longitude);
            });
        }

        function showHistorical() {
            clearMap();
            document.getElementById('historicalBtn').classList.add('active');
            document.getElementById('liveBtn').classList.remove('active');

            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            endDate.setDate(endDate.getDate() + 1);

            const startTime = Math.floor(startDate.getTime() / 1000);
            const endTime = Math.floor(endDate.getTime() / 1000);

            if (currentListener) {
                currentListener();
            }

            const gpsRef = database.ref('GPSData');
            gpsRef.orderByChild('timestamp')
                .startAt(startTime)
                .endAt(endTime)
                .once('value', (snapshot) => {
                    const coordinates = [];
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        coordinates.push({
                            lat: parseFloat(data.latitude),
                            lng: parseFloat(data.longitude)
                        });
                    });

                    if (coordinates.length > 0) {
                        // Draw path
                        path = new google.maps.Polyline({
                            path: coordinates,
                            geodesic: true,
                            strokeColor: '#2196F3',
                            strokeOpacity: 1.0,
                            strokeWeight: 3
                        });
                        path.setMap(map);

                        // Place marker at last position
                        updateMarker(
                            coordinates[coordinates.length - 1].lat,
                            coordinates[coordinates.length - 1].lng
                        );

                        // Fit map to path
                        const bounds = new google.maps.LatLngBounds();
                        coordinates.forEach(coord => bounds.extend(coord));
                        map.fitBounds(bounds);
                    }
                });
        }

        function clearMap() {
            if (path) {
                path.setMap(null);
                path = null;
            }
        }

        function updateMarker(lat, lng) {
            const position = { lat: parseFloat(lat), lng: parseFloat(lng) };
            
            if (!marker) {
                marker = new google.maps.Marker({
                    position: position,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 8,
                        fillColor: '#2196F3',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 2
                    }
                });
            } else {
                marker.setPosition(position);
            }
            
            map.panTo(position);
        }

        // Set default dates
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        
        document.getElementById('startDate').valueAsDate = yesterday;
        document.getElementById('endDate').valueAsDate = today;
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
    </script>
</body>
</html>
