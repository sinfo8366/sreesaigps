<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Data</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>GPS Data</h1>
    <table id="gps-data-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Altitude</th>
                <th>Speed</th>
                <th>Satellites</th>
            </tr>
        </thead>
        <tbody id="gps-data-body">
            <!-- Data will be populated here -->
        </tbody>
    </table>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js"></script>
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCQmODNdyNeNEXJXB_7u-8versZmrXYJRU",
  authDomain: "vehicle-tracking-7f1dd.firebaseapp.com",
  databaseURL: "https://vehicle-tracking-7f1dd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vehicle-tracking-7f1dd",
  storageBucket: "vehicle-tracking-7f1dd.firebasestorage.app",
  messagingSenderId: "876631887074",
  appId: "1:876631887074:web:2d9e7e1bd54f2d603b22bb",
  measurementId: "G-D6KHE5KT14"
        };

        const firebaseApp = firebase.initializeApp(firebaseConfig);

        const db = firebaseApp.database();

        // Get a reference to the GPS data
        const gpsDataRef = db.ref("GPSData");

        // Populate the table with GPS data
        gpsDataRef.on("value", (data) => {
            const gpsDataBody = document.getElementById("gps-data-body");
            gpsDataBody.innerHTML = "";

            data.forEach((childSnapshot) => {
                const childData = childSnapshot.val();
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${childData.timestamp}</td>
                    <td>${childData.latitude}</td>
                    <td>${childData.longitude}</td>
                    <td>${childData.altitude}</td>
                    <td>${childData.speed}</td>
                    <td>${childData.satellites}</td>
                `;
                gpsDataBody.appendChild(row);
            });
        }, (error) => {
            console.error("Error reading data:", error);
        });
    </script>
</body>
</html>
